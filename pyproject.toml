[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenflow"
version = "0.1.0"
description = "Local, read-only GitHub Copilot CLI token usage dashboard"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wenjun-xu"}]
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]

[project.scripts]
tokenflow = "tokenflow.cli:main"

[tool.setuptools.packages.find]
include = ["tokenflow*"]
namespaces = false

[tool.setuptools.package-data]
tokenflow = ["web/*.html", "web/*.js", "web/*.css"]
